# docker-compose/docker-compose.dev.yml
services:
  school-bud-e-frontend:
    image: denoland/deno:alpine
    working_dir: /app
    command:
      - sh
      - -c
      #- NO_COLOR=1 deno run --inspect-brk=0.0.0.0:9229 -A --watch=static/,routes/ dev.ts
      - deno run -A --watch=static/,routes/ dev.ts
    ports:
      - "9229:9229"
    volumes:
      - ../:/app:cached
      - deno_cache:/root/.cache/deno
      - /app/node_modules
    cpu_shares: 256
    mem_limit: 512m
    environment:
      - CHOKIDAR_USEPOLLING=false
      - CHOKIDAR_IGNORED=**/node_modules/**,**/dist/**,**/.git/**

  task-server:
    image: python:3.11-slim
    working_dir: /app
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir -r requirements.txt && \
        python -m debugpy --wait-for-client --listen 0.0.0.0:5678 \
          -m uvicorn app.main:app \
          --host 0.0.0.0 --port 8083 --log-level warning
    ports:
      - "5678:5678"
    volumes:
      - ../ai-tasks-server:/app:cached
      - pip_cache:/root/.cache/pip
    cpu_shares: 128
    mem_limit: 256m

volumes:
  deno_cache:
  pip_cache:
